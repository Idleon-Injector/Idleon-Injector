<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>IDLEON // INJECTOR</title>
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/entry/style.css" />
        <script>
            // Colour concept: ?colour=violet or ?colour=dusk lays that version's colours over the navy ones and
            // remembers the pick (also for the in-game menu); ?colour=navy goes back.
            (function () {
                var key = "colourConcept";
                var pick = new URLSearchParams(location.search).get("colour");
                try {
                    if (pick) localStorage.setItem(key, pick);
                    else pick = localStorage.getItem(key);
                } catch (e) {}
                if (pick !== "violet" && pick !== "dusk") return;
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = "/styles/colour/" + pick + ".css";
                document.head.appendChild(link);
            })();
        </script>
    </head>

    <body>
        <!-- Background Grid & Noise -->
        <div class="hud-background">
            <div class="grid-overlay"></div>
            <div class="vignette"></div>
        </div>

        <!-- VanJS Mount Point -->
        <script type="module">
            import van from "/vendor/van-1.6.0.js";
            import { App } from "/components/App.js";

            // Mount the application
            van.add(document.body, App());
        </script>
    </body>
</html>
