name: Game update watch
on:
    schedule:
        - cron: "17 */3 * * *"
    workflow_dispatch:
        inputs:
            source:
                description: "N.js URL to check instead of the live web game (leave empty for the live game)"
                required: false

permissions:
    contents: read
    issues: write
    actions: write

jobs:
    watch:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            # Opens one issue per game version whose code breaks a name or changes a function the injector hooks.
            - name: Compare the game's code with the pinned names
              env:
                  GH_TOKEN: ${{ github.token }}
                  SOURCE: ${{ inputs.source }}
              run: node scripts/game-names.mjs watch $SOURCE

            # GitHub switches off scheduled workflows after 60 days without repo activity; enabling resets that timer.
            - name: Keep the schedule on
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/game-watch.yml/enable"
