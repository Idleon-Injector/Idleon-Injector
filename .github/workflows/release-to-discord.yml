name: Release To Discord

on:
    # A release published by hand (such as a draft from Build and Release).
    release:
        types: [published]
    # Build and Release calls this: a release it publishes with GITHUB_TOKEN starts no "published" run.
    workflow_call:
        inputs:
            tag:
                required: true
                type: string

permissions:
    contents: read

jobs:
    post:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            # Without the DISCORD_RELEASE_WEBHOOK secret this prints a notice and succeeds.
            - name: Post the release to #injector-updates
              env:
                  DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ inputs.tag || github.event.release.tag_name }}
              run: node scripts/discord-release.mjs "$TAG"
